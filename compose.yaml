name: opsflow

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: opsflow
      POSTGRES_PASSWORD: opsflow
      POSTGRES_DB: opsflow
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=en-US --encoding=UTF8'
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - opsflow-pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opsflow -d opsflow']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15

  webhook-sink:
    image: wiremock/wiremock:3.13.1-alpine
    ports:
      - '127.0.0.1:${WEBHOOK_SINK_PORT:-8081}:8080'
    command: ['--global-response-templating', '--disable-banner']
    volumes:
      - ./infra/wiremock:/home/wiremock:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://localhost:8080/__admin/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  opsflow-pgdata:
