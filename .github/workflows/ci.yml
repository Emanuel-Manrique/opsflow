name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Verify
        run: pnpm check

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Persistence integration suite
        run: pnpm integration

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: opsflow
          POSTGRES_PASSWORD: opsflow
          POSTGRES_DB: opsflow_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opsflow -d opsflow_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://opsflow:opsflow@localhost:5432/opsflow_e2e
      REDIS_URL: redis://localhost:6379/1
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start WireMock chaos stubs
        run: docker compose up -d --wait webhook-sink

      - name: Run e2e suites
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dist/.playwright/apps/web-angular-e2e
          retention-days: 7
